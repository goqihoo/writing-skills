- id: topic-index
  name: Architecture Topic Collection
  group: Navigation
  reader_question: Which topics belong here and when should readers use them?
  template: assets/topic-index-template.md
- id: domain-architecture
  name: Domain Architecture
  group: Domain
  reader_question: Which concepts, rules and capability boundaries define this domain?
  template: assets/domain-architecture-template.md
- id: overall-architecture
  name: Overall Architecture
  group: Primary
  reader_question: How do domain, data, application, protection and operating choices jointly deliver the intended outcomes?
