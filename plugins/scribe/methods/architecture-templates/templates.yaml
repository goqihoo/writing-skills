schema_version: 1
owner_method: architecture-templates
policy: adaptive
templates:
- id: knowledge-set
  name: Architecture Knowledge Set
  group: Navigation
  reader_question: How is this knowledge set organized and entered?
  template: assets/knowledge-set-template.md
- id: view-overview
  name: Architecture View Overview
  group: Navigation
  reader_question: What does this view own and how does it relate to other views?
