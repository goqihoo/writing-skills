<svg xmlns="http://www.w3.org/2000/svg" width="840" height="488" viewBox="0 0 840 488" role="img" aria-labelledby="grouped-title grouped-description" data-scribe-color-mode="categorical">
  <title id="grouped-title">Grouped architecture template</title>
  <desc id="grouped-description">Three responsibility groups exchange input, results, and feedback. Category colors identify groups; all six nodes have equal emphasis. Replace example content from the source.</desc>
  <defs>
    <style>
      .node-title { font: 600 12px Geist, "PingFang SC", "Noto Sans SC", sans-serif; fill: var(--dd-ink, #22263A); }
      .detail { font: 400 9px Geist, "PingFang SC", "Noto Sans SC", sans-serif; fill: var(--dd-muted, #596174); }
      .group-title { font: 500 9px Geist, "PingFang SC", "Noto Sans SC", sans-serif; }
      .connector-label { font: 400 8px Geist, "PingFang SC", "Noto Sans SC", sans-serif; fill: var(--dd-muted, #596174); }
      .connector-label-surface { fill: var(--dd-connector-label-surface, none); stroke: none; }
      .flow { fill: none; stroke-width: 1.2; }
      .feedback { stroke-width: 1; stroke-dasharray: 4,3; }
    </style>
    <marker id="grouped-arrow-1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-category-1, #4F5BD5)"/></marker>
    <marker id="grouped-arrow-2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-category-2, #007A59)"/></marker>
    <marker id="grouped-arrow-3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-category-3, #8240C9)"/></marker>
  </defs>
  <rect id="canvas" width="840" height="488" fill="var(--dd-paper, #FFFFFF)"/>
  <g id="zones">
    <rect x="56" y="40" width="200" height="352" rx="8" stroke-width="0.8" fill="var(--dd-category-3-a020, rgba(130,64,201,0.02))" stroke="var(--dd-category-3-a350, rgba(130,64,201,0.35))"/>
    <text class="group-title" x="72" y="64" fill="var(--dd-category-3, #8240C9)">INPUTS</text>
    <rect x="328" y="40" width="200" height="352" rx="8" stroke-width="0.8" fill="var(--dd-category-1-a020, rgba(79,91,213,0.02))" stroke="var(--dd-category-1-a350, rgba(79,91,213,0.35))"/>
    <text class="group-title" x="344" y="64" fill="var(--dd-category-1, #4F5BD5)">PROCESSING</text>
    <rect x="600" y="40" width="200" height="352" rx="8" stroke-width="0.8" fill="var(--dd-category-2-a020, rgba(0,122,89,0.02))" stroke="var(--dd-category-2-a350, rgba(0,122,89,0.35))"/>
    <text class="group-title" x="616" y="64" fill="var(--dd-category-2, #007A59)">APPLICATIONS</text>
  </g>
  <g id="connectors">
    <path class="flow" d="M 236 160 H 348" stroke="var(--dd-category-3, #8240C9)" marker-end="url(#grouped-arrow-3)" data-source="input" data-target="processing"/>
    <path class="flow" d="M 156 288 V 248 Q 156 240 164 240 H 372 Q 380 240 380 232 V 192" stroke="var(--dd-category-3, #8240C9)" marker-end="url(#grouped-arrow-3)" data-source="verification" data-target="processing"/>
    <path class="flow" d="M 428 192 V 288" stroke="var(--dd-category-1, #4F5BD5)" marker-end="url(#grouped-arrow-1)" data-source="processing" data-target="evaluation"/>
    <path class="flow" d="M 508 160 H 620" stroke="var(--dd-category-1, #4F5BD5)" marker-end="url(#grouped-arrow-1)" data-source="processing" data-target="actions"/>
    <path class="flow" d="M 508 320 H 620" stroke="var(--dd-category-1, #4F5BD5)" marker-end="url(#grouped-arrow-1)" data-source="evaluation" data-target="feedback"/>
    <path class="flow" d="M 700 192 V 288" stroke="var(--dd-category-2, #007A59)" marker-end="url(#grouped-arrow-2)" data-source="actions" data-target="feedback"/>
    <path class="flow feedback" d="M 700 352 V 416 Q 700 424 692 424 H 48 Q 40 424 40 416 V 168 Q 40 160 48 160 H 76" stroke="var(--dd-category-2, #007A59)" marker-end="url(#grouped-arrow-2)" data-source="feedback" data-target="input"/>
  </g>
  <g id="labels">
    <rect class="connector-label-surface" x="254.4" y="138" width="75.2" height="12" rx="2"/>
    <text class="connector-label" x="292" y="148" text-anchor="middle">Prepared input</text>
    <rect class="connector-label-surface" x="226.4" y="218" width="75.2" height="12" rx="2"/>
    <text class="connector-label" x="264" y="228" text-anchor="middle">Verified input</text>
    <rect class="connector-label-surface" x="436" y="234" width="56" height="12" rx="2"/>
    <text class="connector-label" x="440" y="244" text-anchor="start">Assessment</text>
    <rect class="connector-label-surface" x="543.2" y="138" width="41.6" height="12" rx="2"/>
    <text class="connector-label" x="564" y="148" text-anchor="middle">Results</text>
    <rect class="connector-label-surface" x="536" y="298" width="56" height="12" rx="2"/>
    <text class="connector-label" x="564" y="308" text-anchor="middle">Evaluation</text>
    <rect class="connector-label-surface" x="708" y="234" width="84.8" height="12" rx="2"/>
    <text class="connector-label" x="712" y="244" text-anchor="start">Observed results</text>
    <rect class="connector-label-surface" x="387.2" y="434" width="65.6" height="12" rx="2"/>
    <text class="connector-label" x="420" y="444" text-anchor="middle">Next version</text>
  </g>
  <g data-category="3">
    <g class="component" id="input">
      <rect class="mask" x="76" y="128" width="160" height="64" rx="6" fill="var(--dd-paper, #FFFFFF)"/>
      <rect class="node" x="76" y="128" width="160" height="64" rx="6" stroke-width="1" fill="var(--dd-category-3-tint, #F3E9FE)" stroke="var(--dd-category-3, #8240C9)"/>
      <text class="node-title" x="156" y="156" text-anchor="middle">Data preparation</text>
      <text class="detail" x="156" y="176" text-anchor="middle">Collect and normalize</text>
    </g>
    <g class="component" id="verification">
      <rect class="mask" x="76" y="288" width="160" height="64" rx="6" fill="var(--dd-paper, #FFFFFF)"/>
      <rect class="node" x="76" y="288" width="160" height="64" rx="6" stroke-width="1" fill="var(--dd-category-3-tint, #F3E9FE)" stroke="var(--dd-category-3, #8240C9)"/>
      <text class="node-title" x="156" y="316" text-anchor="middle">Verification</text>
      <text class="detail" x="156" y="336" text-anchor="middle">Check evidence</text>
    </g>
  </g>
  <g data-category="1">
    <g class="component" id="processing">
      <rect class="mask" x="348" y="128" width="160" height="64" rx="6" fill="var(--dd-paper, #FFFFFF)"/>
      <rect class="node" x="348" y="128" width="160" height="64" rx="6" stroke-width="1" fill="var(--dd-category-1-tint, #E9EBFE)" stroke="var(--dd-category-1, #4F5BD5)"/>
      <text class="node-title" x="428" y="156" text-anchor="middle">Processing</text>
      <text class="detail" x="428" y="176" text-anchor="middle">Assess current state</text>
    </g>
    <g class="component" id="evaluation">
      <rect class="mask" x="348" y="288" width="160" height="64" rx="6" fill="var(--dd-paper, #FFFFFF)"/>
      <rect class="node" x="348" y="288" width="160" height="64" rx="6" stroke-width="1" fill="var(--dd-category-1-tint, #E9EBFE)" stroke="var(--dd-category-1, #4F5BD5)"/>
      <text class="node-title" x="428" y="316" text-anchor="middle">Evaluation</text>
      <text class="detail" x="428" y="336" text-anchor="middle">Estimate outcomes</text>
    </g>
  </g>
  <g data-category="2">
    <g class="component" id="actions">
      <rect class="mask" x="620" y="128" width="160" height="64" rx="6" fill="var(--dd-paper, #FFFFFF)"/>
      <rect class="node" x="620" y="128" width="160" height="64" rx="6" stroke-width="1" fill="var(--dd-category-2-tint, #DDF8F0)" stroke="var(--dd-category-2, #007A59)"/>
      <text class="node-title" x="700" y="156" text-anchor="middle">Actions</text>
      <text class="detail" x="700" y="176" text-anchor="middle">Plan the response</text>
    </g>
    <g class="component" id="feedback">
      <rect class="mask" x="620" y="288" width="160" height="64" rx="6" fill="var(--dd-paper, #FFFFFF)"/>
      <rect class="node" x="620" y="288" width="160" height="64" rx="6" stroke-width="1" fill="var(--dd-category-2-tint, #DDF8F0)" stroke="var(--dd-category-2, #007A59)"/>
      <text class="node-title" x="700" y="316" text-anchor="middle">Feedback</text>
      <text class="detail" x="700" y="336" text-anchor="middle">Validate the next version</text>
    </g>
  </g>
</svg>
