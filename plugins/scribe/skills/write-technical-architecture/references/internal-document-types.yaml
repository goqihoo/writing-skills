schema_version: 1
owner_skill: write-technical-architecture
model: Company Technical Architecture and Project Delivery Architecture
types:
- id: technical-architecture
  name: Technical Architecture
  description: Describe company-level Technical Landscape structure, principles, boundaries, relationships, failure domains, and evolution.
  reader_question: How does the company's Technical Landscape fit together and evolve as a system of Systems?
  authority: Company-level Technical Architecture; the artifact title need not contain the word company.
  completion: The named Technical Landscape Architecture Object, Scope, Company Authority Level, relevant domains and viewpoints, principles, constraints, Systems, boundaries, owners, critical relationships, controls, deployment and runtime concerns, decisions, validation, and evolution are coherent and traceable; the principal view and responsibility explanation let the reader identify Systems, their connections, and current versus intended state.
  template:
    path: ../assets/technical-architecture-template.md
    policy: adaptive
- id: product-system-map
  name: Product-System Map
  description: Maintain many-to-many Product, System, and capability relationships without redefining Product or System authorities.
  reader_question: Which Systems realize each Product and capability, and which Products depend on each System?
  authority: Company-level mapping among accepted Product and System authorities, excluding Product definitions and System internal design.
  completion: Architecture Object, Scope, Company Authority Level, Product, capability, and System relationships, owners, validity, critical dependencies, and authority links are current.
  template:
    path: ../assets/product-system-map-template.md
    policy: adaptive
- id: delivery-index
  name: Architecture Delivery Entry
  description: Create architecture delivery entry for one concrete delivery.
  reader_question: Where are the delivery architecture artifacts, decisions and acceptance evidence?
  authority: One named Project delivery; link governing company/System architecture and Machine Authority.
  completion: Scope, baseline, selected or proposed design, decision authority, dependencies, compatibility, and evidence are traceable; acceptance is never asserted without supporting results.
  template:
    path: ../assets/delivery-index-template.md
    policy: adaptive
